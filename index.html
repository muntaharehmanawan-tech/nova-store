<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f6f7;color:#111}
header{background:#111;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:10}
.top{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:22px;font-weight:700;margin-right:8px}
.search{flex:1;min-width:220px;display:flex}
.search input{flex:1;padding:12px 14px;border:0;border-radius:8px 0 0 8px;font-size:16px;outline:none}
.search button{padding:0 18px;border:0;background:#f5a623;font-weight:700;border-radius:0 8px 8px 0;cursor:pointer}
select{padding:11px;border-radius:8px;border:0;font-size:14px}
.chips{max-width:1200px;margin:12px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:999px;background:#2b2b2b;color:#ddd;border:0;cursor:pointer;font-size:14px}
.chip.active{background:#f5a623;color:#111;font-weight:700}
main{max-width:1200px;margin:auto;padding:18px 14px}
#info{color:#555;font-size:14px;margin-bottom:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);display:flex;flex-direction:column}
.card img{width:100%;height:200px;object-fit:contain;background:#fafafa;border-radius:8px}
.tag{font-size:11px;color:#888;text-transform:uppercase;margin-top:10px}
.card h3{font-size:14px;line-height:1.35;margin:4px 0 8px;height:38px;overflow:hidden}
.price{font-size:19px;font-weight:700;margin-top:auto}
.ship{font-size:12px;color:#2e7d32;margin-top:2px}
#more{display:block;margin:24px auto;padding:12px 32px;border:0;border-radius:8px;background:#111;color:#fff;font-size:15px;cursor:pointer}
.empty{padding:50px;text-align:center;color:#666}
</style>
</head>
<body>
<header>

      <input id="q" type="search" placeholder="Search products or categories...">

    </div>
    <select id="sort">
      <option value="rel">Featured</option>
      <option value="pa">Price: Low to High</option>
      <option value="pd">Price: High to Low</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="info"></div>
  <div id="grid"></div>
  <button id="more" hidden>Load more</button>
</main>

const PAGE = 24;
let cat = "All", shown = PAGE;
const $ = id => document.getElementById(id);

function norm(s){return (s||"").toLowerCase()}

function filtered(){
  const q = norm($("q").value).trim();
  const words = q.split(/\s+/).filter(Boolean);
  let list = DATA.filter(p => {
    if (cat !== "All" && p.c !== cat) return false;
    const hay = norm(p.n + " " + p.c + " " + p.k);
    return words.every(w => hay.includes(w));
  });
  const s = $("sort").value;
  if (s === "pa") list.sort((a,b)=>a.p-b.p);
  if (s === "pd") list.sort((a,b)=>b.p-a.p);
  return list;
}

function renderChips(){
  const counts = {};
  DATA.forEach(p => counts[p.c] = (counts[p.c]||0)+1);
  const names = ["All", ...Object.keys(counts).sort()];
  $("chips").innerHTML = "";
  names.forEach(n => {
    const b = document.createElement("button");
    b.className = "chip" + (n === cat ? " active" : "");
    b.textContent = n === "All" ? "All (" + DATA.length + ")" : n + " (" + counts[n] + ")";
    b.onclick = () => { cat = n; shown = PAGE; renderChips(); render(); };
    $("chips").appendChild(b);
  });
}

function render(){
  const list = filtered();
  const grid = $("grid");
  grid.innerHTML = "";
  $("info").textContent = list.length + " product" + (list.length === 1 ? "" : "s");

  if (!list.length){
    grid.innerHTML = '<div class="empty">No products found.</div>';
    $("more").hidden = true;
    return;
  }

  list.slice(0, shown).forEach(p => {
    const d = document.createElement("div");
    d.className = "card";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = p.n; img.src = p.i;
    const t = document.createElement("div"); t.className = "tag"; t.textContent = p.c;
    const h = document.createElement("h3"); h.textContent = p.n;
    const pr = document.createElement("div"); pr.className = "price"; pr.textContent = "$" + p.p.toFixed(2);
    const sh = document.createElement("div"); sh.className = "ship";
    sh.textContent = p.f ? "Free shipping" : "Shipping included";
    d.append(img, t, h, pr, sh);
    grid.appendChild(d);
  });

  $("more").hidden = shown >= list.length;
}

let timer;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { shown = PAGE; render(); }, 200); });
$("go").onclick = () => { shown = PAGE; render(); };
$("sort").onchange = () => { shown = PAGE; render(); };
$("more").onclick = () => { shown += PAGE; render(); };

renderChips();
render();
</script>
