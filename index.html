<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaMarket | US Trending Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f9fafb;color:#111827}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 20px;font-size:22px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
header span{color:#2563eb}
.secure-badge{font-size:12px;background:#eff6ff;color:#1d4ed8;padding:6px 12px;border-radius:20px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;max-width:1300px;margin:auto;padding:24px 16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 0.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,0.05)}
.card img{width:100%;height:230px;object-fit:cover;background:#f3f4f6}
.cb{padding:14px}.t{font-weight:700;font-size:15px;margin-bottom:6px;color:#1f2937}
.pr{font-size:20px;font-weight:800;margin-bottom:6px;color:#0f172a}.sn{font-size:12px;color:#059669;margin-bottom:10px;font-weight:600}
.btn{display:block;width:100%;text-align:center;background:#2563eb;color:#fff;padding:12px;border:0;border-radius:8px;font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{background:#1d4ed8}
#m{position:fixed;inset:0;background:rgba(15,23,42,.75);display:none;align-items:center;justify-content:center;z-index:9}
#m.on{display:flex}
#mc{background:#fff;width:92%;max-width:480px;max-height:90vh;overflow:auto;border-radius:14px;padding:20px;position:relative}
#mx{position:absolute;top:10px;right:12px;border:0;background:#f3f4f6;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
#mi{width:100%;height:280px;object-fit:cover;border-radius:10px;background:#f3f4f6}
#th{display:flex;gap:8px;margin:8px 0;overflow-x:auto}
#th img{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}
#th img.active{border-color:#2563eb}
.rv{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-top:8px;font-size:13px}
footer{text-align:center;color:#6b7280;font-size:13px;padding:30px}
.loader{text-align:center;padding:50px;color:#6b7280;font-size:16px;grid-column:1/-1}
</style></head><body>
<header><div>Nova<span>Market</span></div><div class="secure-badge">🔒 Secure US Checkout</div></header>
<div class="grid" id="grid"><div class="loader">Loading trending products...</div></div>
<div id="m" onclick="if(event.target.id==='m')cl()"><div id="mc">
<button id="mx" onclick="cl()">×</button>
<img id="mi" alt=""><div id="th"></div>
<h2 id="mt" style="margin:8px 0;font-size:20px"></h2><div class="pr" id="mp"></div>
<p id="md" style="font-size:14px;color:#4b5563;margin:8px 0;line-height:1.5"></p>
<p class="sn" id="ms"></p><a class="btn" id="mb" target="_blank" rel="noopener">Buy Now</a>
<div id="mr"></div></div></div>
<footer>&copy; 2026 NovaMarket Direct. All Rights Reserved.</footer>
<script>
let D={};
const PH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="#f3f4f6"/><text x="50%" y="50%" text-anchor="middle" fill="#6b7280" font-family="sans-serif" font-size="16">Image unavailable</text></svg>');

fetch('products.json')
    .then(r => r.json())
    .then(data => {
        // Convert array or dict to indexed object
        if (Array.isArray(data)) {
            data.forEach(p => { D[p.id] = p; });
        } else {
            D = data;
        }
        renderGrid();
    })
    .catch(err => {
        grid.innerHTML = '<div class="loader" style="color:#dc2626">Failed to load products. Please refresh.</div>';
    });

function renderGrid(){
    const keys = Object.keys(D);
    if(keys.length === 0){
        grid.innerHTML = '<div class="loader">No profitable products found in this cycle.</div>';
        return;
    }
    let html = '';
    keys.forEach(id => {
        const p = D[id];
        const pid = escapeHtml(p.id);
        const img = escapeHtml(p.images[0] || '');
        const title = escapeHtml(p.title);
        const price = escapeHtml(p.price);
        const sn = escapeHtml(p.shipping_note);

        html += `
            <article class="card" onclick="op('${pid}')">
                <img src="${img}" alt="${title}" loading="lazy" onerror="this.onerror=null;this.src=PH">
                <div class="cb"><div class="t">${title}</div>
                <div class="pr">$${price}</div>
                <div class="sn">${sn}</div>
                <button class="btn" onclick="event.stopPropagation();op('${pid}')">View Details</button>
                </div></article>
        `;
    });
    grid.innerHTML = html;
}

function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function op(id){
    const p=D[id];
    if(!p)return;
    mt.textContent=p.title;
    mp.textContent='$'+p.price;
    md.textContent=p.description;
    ms.textContent=p.shipping_note;
    mb.href=p.buy_url||'#';
    mb.style.display=p.buy_url?'block':'none';
    
    mi.src=p.images[0];
    th.innerHTML='';
    p.images.forEach((u, idx)=>{
        const i=document.createElement('img');
        i.src=u;
        if(idx===0) i.className='active';
        i.onclick=()=>{
            mi.src=u;
            document.querySelectorAll('#th img').forEach(img=>img.classList.remove('active'));
            i.classList.add('active');
        };
        th.appendChild(i);
    });
    
    mr.innerHTML='';
    if(p.reviews && p.reviews.length){
        const h=document.createElement('h4');
        h.textContent='Customer Reviews';
        h.style.marginTop='14px';
        mr.appendChild(h);
        p.reviews.forEach(r=>{
            const d=document.createElement('div');
            d.className='rv';
            d.innerHTML='<strong>'+escapeHtml(r.user)+':</strong> '+escapeHtml(r.comment);
            mr.appendChild(d);
        });
    }
    m.classList.add('on');
    document.body.style.overflow='hidden';
}

function cl(){
    m.classList.remove('on');
    document.body.style.overflow='auto';
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')cl()});
</script></body></html>
